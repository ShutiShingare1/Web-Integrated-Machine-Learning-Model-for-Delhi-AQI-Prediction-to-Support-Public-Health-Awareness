<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<title>Delhi AQI Forecasting | Login</title>

<link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">

</head>

<body>

<!-- HEADER -->

<header class="main-header">
<div class="header-container">
<h2 class="logo">Delhi AQI Forecasting</h2>
</div>
</header>


<!-- LOGIN SECTION -->

<section class="login-section">

<div class="login-card">

<h2>Login Account</h2>

{% if db_offline %}
<div style="background-color: #d35400; color: #fff; text-align: center; padding: 10px; border-radius: 4px; margin-bottom: 20px; font-size: 13px; font-weight: bold; font-family: sans-serif;">
    <i class="fa fa-info-circle"></i> Note: Database is offline. Clicking Login will instantly log you in as a Demo User.
</div>
{% endif %}

<form method="POST" action="/login">

<input
type="text"
name="username"
placeholder="Email"
required
>

<input
type="password"
name="password"
placeholder="Password"
required
>

<button type="submit" class="login-btn">
Login
</button>
    {% if error %}
<p class="error">{{ error }}</p>
{% endif %}

</form>

<p class="forgot">
<a href="/forgot_password">Forgot Password?</a>
</p>

<p class="signup">
Don't have an account?
<a href="/register">Create Account</a>
</p>

</div>

</section>


<footer class="footer">
    Made By Shweta, Shruti, & Shivani.
</footer>

</body>
</html>
