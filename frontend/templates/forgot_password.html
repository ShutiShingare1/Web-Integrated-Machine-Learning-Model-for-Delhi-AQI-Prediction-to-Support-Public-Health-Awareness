<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<title>Delhi AQI Forecasting | Forgot Password</title>

<link rel="stylesheet" href="{{ url_for('static', filename='css/forgot.css') }}">

</head>

<body>

<!-- HEADER -->
<header class="main-header">
<div class="header-container">
<h2 class="logo">Delhi AQI Forecasting</h2>
</div>
</header>


<section class="forgot-section">

<div class="forgot-card">

<h2>Reset Password</h2>


<!-- ================= EMAIL STEP ================= -->

<div id="emailStep">

<input
type="email"
id="email"
placeholder="Enter Registered Email"
required
>

<button class="main-btn" onclick="sendOTP()">
Submit
</button>

<p id="status" class="status-text"></p>

</div>



<!-- ================= OTP STEP ================= -->

<div id="otpStep" style="display:none;">

<input
type="text"
id="otp"
placeholder="Enter 6 Digit OTP"
maxlength="6"
>

<button class="main-btn" onclick="verifyOTP()">
Submit OTP
</button>

<p id="timerText"></p>

<button
class="resend-btn"
id="resendBtn"
onclick="sendOTP()"
disabled
>
Resend OTP
</button>

</div>



<!-- ================= PASSWORD STEP ================= -->

<form
id="passwordStep"
method="POST"
action="/reset_password"
style="display:none;"
>

<input
type="password"
name="password"
placeholder="New Password"
required
pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z])(?=.*[@#$%^&+=!]).{8,}"
title="Minimum 8 characters with uppercase, lowercase, number and symbol"
>

<input
type="password"
name="confirm_password"
placeholder="Confirm Password"
required
>

<button type="submit" class="main-btn">
Update Password
</button>

</form>


</div>

</section>


<footer class="footer">
    Made By Shweta, Shruti, & Shivani.
</footer>

<script src="{{ url_for('static', filename='js/forgot.js') }}"></script>

</body>
</html>
